<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>missed — Order Tracker</title>
<style>
:root {
  --red: #970d1b;
  --dark: #690813;
  --bg: #260306;
  --card: #390509;
  --cream: #fff0d8;
  --gold: #c99b49;
  --line: #8c1720;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--gold);
  font-family: Arial, sans-serif;
}
header {
  background: var(--dark);
  padding: 22px;
  border-radius: 0 0 20px 20px;
}
.header-inner {
  max-width: 1100px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  flex-wrap: wrap;
}
.brand {
  display: flex;
  align-items: center;
  color: var(--cream);
  font-family: "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  font-size: clamp(36px, 7vw, 60px);
  font-weight: 900;
  letter-spacing: -3px;
  line-height: 1;
}
.phone-i {
  display: inline-flex;
  width: .72em;
  height: 1em;
  margin: 0 .015em;
  align-items: center;
}
.phone-i svg { width: 100%; height: 100%; overflow: visible; }
.subtitle { color: var(--gold); }
main { max-width: 1100px; margin: auto; padding: 16px; }
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
h2 { margin: 14px 0; }
.tabs { display: flex; gap: 7px; flex-wrap: wrap; }
button { cursor: pointer; font: inherit; font-weight: bold; }
.tab, .secondary {
  padding: 12px 16px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--card);
  color: var(--gold);
}
.active, .primary {
  background: var(--red) !important;
  color: var(--cream) !important;
}
.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.product {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 18px;
  min-height: 120px;
  text-align: left;
  font-size: 18px;
  color: var(--gold);
}
.product small {
  display: block;
  color: var(--gold);
  margin-top: 12px;
  font-size: 14px;
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 17px;
  margin: 14px 0;
}
label { display: block; margin: 14px 0 6px; font-weight: bold; }
input, select {
  width: 100%;
  padding: 13px;
  border: 1px solid var(--line);
  border-radius: 9px;
  font-size: 16px;
  background: var(--bg);
  color: var(--gold);
}
.flavors { display: grid; grid-template-columns: 1fr; gap: 8px; }
.choice {
  padding: 13px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--bg);
  color: var(--gold);
}
.choice.selected { background: var(--red); color: var(--cream); }
.primary {
  border: 0;
  border-radius: 10px;
  padding: 15px;
  width: 100%;
  margin-top: 15px;
  font-size: 16px;
}
.secondary { margin-top: 10px; }
.hidden { display: none !important; }
.order {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  border-top: 1px solid var(--line);
  padding: 13px 0;
}
.detail { font-size: 13px; color: var(--gold); margin-top: 5px; line-height: 1.7; }
.total {
  background: var(--dark);
  color: var(--gold);
  padding: 18px;
  border-radius: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
}
.total strong { font-size: 22px; }
.danger {
  background: #4a080d;
  color: var(--cream);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 10px;
  margin-top: 5px;
}
.note { color: var(--gold); font-size: 14px; line-height: 1.6; }
@media (min-width: 650px) {
  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .flavors { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand" aria-label="missed">
      <span>m</span>
      <span class="phone-i">
        <svg viewBox="0 0 90 110" role="img" aria-label="Telephone handset">
          <g fill="none" stroke="#fff0d8" stroke-width="6" stroke-linecap="round">
            <path d="M48 10 Q68 25 48 40"/>
            <path d="M58 3 Q85 25 58 47"/>
            <path d="M68 0 Q98 25 68 54"/>
          </g>
          <path fill="#fff0d8"
            d="M17 30 Q8 32 8 44 L8 65
               Q8 91 28 103 Q36 108 43 99
               L51 88 Q55 82 48 77
               L38 69 Q33 65 28 71
               L24 76 Q15 68 16 53
               L22 49 Q28 45 25 39 L22 32
               Q21 29 17 30 Z"/>
        </svg>
      </span>
      <span>ssed</span>
    </div>
    <div class="subtitle">Order tracker · AED</div>
  </div>
</header>

<main>
  <div class="top">
    <h2 id="heading">Choose a product</h2>
    <div class="tabs">
      <button class="tab active" data-page="menu">Menu</button>
      <button class="tab" data-page="history">Order history</button>
      <button class="tab" data-page="prices">Prices</button>
    </div>
  </div>

  <section id="menu">
    <div class="grid" id="products"></div>

    <div class="card hidden" id="form">
      <h2 id="productName"></h2>
      <div id="flavorBox">
        <label>Choose flavour</label>
        <div class="flavors" id="flavors"></div>
      </div>

      <label for="qty">Quantity</label>
      <select id="qty">
        <option>1</option><option>2</option><option>3</option>
        <option>4</option><option>5</option>
      </select>

      <label for="price">Price each (AED)</label>
      <input id="price" type="number" min="0" step="0.5">

      <button class="primary" id="add">Add order to history</button>
      <button class="secondary" id="cancel">Cancel</button>
    </div>

    <div class="card">
      <h2>Recent orders</h2>
      <div id="recent"></div>
      <div class="total"><span>TOTAL MONEY</span><strong id="total1">AED 0.00</strong></div>
    </div>
  </section>

  <section id="history" class="hidden">
    <div class="card">
      <h2>Order history</h2>
      <div id="orders"></div>
      <div class="total"><span>TOTAL MONEY</span><strong id="total2">AED 0.00</strong></div>
      <button class="primary" id="export">Export CSV</button>
      <button class="danger" id="backup">Download JSON backup</button>
      <button class="danger" id="clear">Clear history</button>
      <p class="note">Orders are saved in this browser on this device. Export a backup regularly.</p>
    </div>
  </section>

  <section id="prices" class="hidden">
    <div class="card">
      <h2>Menu prices</h2>
      <p class="note">Set your usual prices here. You can also change a price when adding an order.</p>
      <div id="priceList"></div>
      <button class="primary" id="savePrices">Save prices</button>
    </div>
  </section>
</main>

<script>
const items = [
  {id:"hot", name:"V60 Hot", flavors:["Salted Caramel","Blueberry Blast Cake","Cookies and Dream"], price:0},
  {id:"cold", name:"V60 Cold", flavors:["Cookies and Dream","Salted Caramel","Blueberry Blast Cake"], price:0},
  {id:"hibiscus", name:"Dirty Hibiscus", price:0},
  {id:"mojito", name:"Passion Fruit Mojito", price:20},
  {id:"scoop", name:"Scoop Cookies", price:32},
  {id:"pudding", name:"Honey Pudding", price:20},
  {id:"cheesecake", name:"Cheesecake", price:15}
];

const $ = id => document.getElementById(id);
const defaultPrices = Object.fromEntries(items.map(p => [p.id, p.price]));

function loadJSON(key, fallback) {
  try {
    const value = localStorage.getItem(key);
    return value ? JSON.parse(value) : fallback;
  } catch {
    return fallback;
  }
}

let prices = {...defaultPrices, ...loadJSON("missed_prices", {})};
let orders = loadJSON("missed_orders", []);
let selected = null;
let flavor = "";

const money = n => "AED " + Number(n || 0).toFixed(2);

function save() {
  localStorage.setItem("missed_prices", JSON.stringify(prices));
  localStorage.setItem("missed_orders", JSON.stringify(orders));
}

function total() {
  return orders.reduce((sum, order) => sum + Number(order.total || 0), 0);
}

function safe(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[c]));
}

function drawProducts() {
  $("products").innerHTML = items.map(p => `
    <button class="product" data-id="${p.id}">
      ${safe(p.name)}
      <small>${money(prices[p.id])}${p.flavors ? " · Choose flavour" : ""}</small>
    </button>
  `).join("");

  document.querySelectorAll(".product").forEach(button => {
    button.onclick = () => openProduct(button.dataset.id);
  });
}

function openProduct(id) {
  selected = items.find(p => p.id === id);
  flavor = selected.flavors ? selected.flavors[0] : "";

  $("productName").textContent = selected.name;
  $("form").classList.remove("hidden");
  $("flavorBox").classList.toggle("hidden", !selected.flavors);

  if (selected.flavors) {
    $("flavors").innerHTML = selected.flavors.map((f, i) => `
      <button class="choice ${i === 0 ? "selected" : ""}" data-flavor="${safe(f)}">
        ${safe(f)}
      </button>
    `).join("");

    document.querySelectorAll(".choice").forEach(button => {
      button.onclick = () => {
        flavor = button.dataset.flavor;
        document.querySelectorAll(".choice").forEach(choice => {
          choice.classList.toggle("selected", choice === button);
        });
      };
    });
  }

  $("qty").value = "1";
  $("price").value = prices[id] ?? 0;
  $("form").scrollIntoView({behavior:"smooth", block:"start"});
}

$("cancel").onclick = () => {
  $("form").classList.add("hidden");
  selected = null;
};

$("add").onclick = () => {
  if (!selected) return;

  const quantity = Number($("qty").value);
  const price = Number($("price").value);

  if (!Number.isInteger(quantity) || quantity < 1 || quantity > 5 ||
      $("price").value === "" || !Number.isFinite(price) || price < 0) {
    alert("Please check the quantity and price.");
    return;
  }

  orders.unshift({
    id: Date.now(),
    name: selected.name + (selected.flavors ? " — " + flavor : ""),
    product: selected.name,
    flavor: selected.flavors ? flavor : "",
    qty: quantity,
    price,
    total: quantity * price,
    time: Date.now()
  });

  save();
  render();
  $("form").classList.add("hidden");
  selected = null;
};

function orderHTML(order) {
  return `
    <div class="order">
      <div>
        <b>${safe(order.name)}</b>
        <div class="detail">
          Quantity: ${order.qty}<br>
          ${money(order.price)} each<br>
          ${new Date(order.time).toLocaleString()}
        </div>
      </div>
      <div>
        <b>${money(order.total)}</b><br>
        <button class="danger" onclick="removeOrder(${Number(order.id)})">Undo</button>
      </div>
    </div>
  `;
}

window.removeOrder = id => {
  if (confirm("Remove this order?")) {
    orders = orders.filter(order => order.id !== id);
    save();
    render();
  }
};

function render() {
  $("recent").innerHTML = orders.slice(0, 5).map(orderHTML).join("") || "No orders yet.";
  $("orders").innerHTML = orders.map(orderHTML).join("") || "No orders recorded yet.";
  $("total1").textContent = money(total());
  $("total2").textContent = money(total());
  drawProducts();
}

function showPage(page) {
  ["menu", "history", "prices"].forEach(id => {
    $(id).classList.toggle("hidden", id !== page);
  });

  document.querySelectorAll(".tab").forEach(button => {
    button.classList.toggle("active", button.dataset.page === page);
  });

  $("heading").textContent =
    page === "menu" ? "Choose a product" :
    page === "history" ? "Order history" : "Menu prices";

  if (page === "prices") drawPriceList();
}

document.querySelectorAll(".tab").forEach(button => {
  button.onclick = () => showPage(button.dataset.page);
});

function drawPriceList() {
  $("priceList").innerHTML = items.map(p => `
    <label for="price-${p.id}">${safe(p.name)} (AED)</label>
    <input id="price-${p.id}" type="number" min="0" step="0.5"
      data-id="${p.id}" value="${Number(prices[p.id] ?? 0)}">
  `).join("");
}

$("savePrices").onclick = () => {
  document.querySelectorAll("#priceList input").forEach(input => {
    const value = Number(input.value);
    if (input.value !== "" && Number.isFinite(value) && value >= 0) {
      prices[input.dataset.id] = value;
    }
  });

  save();
  drawProducts();
  alert("Prices saved!");
};

$("clear").onclick = () => {
  if (confirm("Delete all order history? This cannot be undone.")) {
    orders = [];
    save();
    render();
  }
};

function downloadFile(filename, content, type) {
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

$("export").onclick = () => {
  const rows = [
    ["Date", "Item", "Flavor", "Quantity", "Price each", "Total"],
    ...orders.map(o => [
      new Date(o.time).toLocaleString(),
      o.product, o.flavor, o.qty, o.price, o.total
    ])
  ];

  const csv = rows.map(row =>
    row.map(value => '"' + String(value ?? "").replace(/"/g, '""') + '"').join(",")
  ).join("\r\n");

  downloadFile("missed-order-history.csv", csv, "text/csv;charset=utf-8;");
};

$("backup").onclick = () => {
  downloadFile(
    "missed-backup.json",
    JSON.stringify({prices, orders}, null, 2),
    "application/json"
  );
};

render();
</script>
</body>
</html>
